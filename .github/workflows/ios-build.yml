name: iOS Mobile Client Build

on:
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Target
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Build Swift Package for iOS Simulator
        run: |
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "iOS Simulator SDK: $SDK_PATH"
          swift build --package-path apps/ios \
            -Xswiftc "-sdk" -Xswiftc "$SDK_PATH" \
            -Xswiftc "-target" -Xswiftc "arm64-apple-ios16.0-simulator"

      - name: Build with Xcode for iOS Simulator
        run: |
          cd apps/ios
          xcodebuild build \
            -scheme DshMobile \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
